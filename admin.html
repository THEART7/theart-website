<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>T-HEART Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 1100px;
      margin: auto;
      padding: 20px;
      background: #f5f5f5;
    }

    h1 {
      margin-bottom: 25px;
    }

    .card {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 12px;
    }

    input, textarea, button {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      box-sizing: border-box;
    }

    button {
      cursor: pointer;
      font-weight: bold;
    }

    .hidden {
      display: none;
    }

    .product {
      border: 1px solid #ddd;
      padding: 15px;
      margin: 10px 0;
      border-radius: 8px;
    }
  </style>
</head>

<body>

  <h1>T-HEART Admin Panel</h1>

  <div id="loginBox" class="card">
    <h2>Admin Login</h2>

    <input id="email" type="email" placeholder="Admin Email">
    <input id="password" type="password" placeholder="Password">

    <button onclick="login()">Login</button>

    <p id="loginMessage"></p>
  </div>

  <div id="adminPanel" class="hidden">

    <div class="card">
      <h2>Dashboard</h2>
      <p id="welcome"></p>
      <button onclick="logout()">Logout</button>
    </div>

    <div class="card">
      <h2>Add Product</h2>

      <input id="productName" placeholder="Product Name">
      <textarea id="productDescription" placeholder="Description"></textarea>
      <input id="productPrice" type="number" placeholder="Price">
      <input id="productImage" placeholder="Image URL">
      <input id="productSizes" placeholder="Sizes e.g. S,M,L,XL,XXL">
      <input id="productStock" type="number" placeholder="Stock">

      <button onclick="addProduct()">Add Product</button>

      <p id="productMessage"></p>
    </div>

    <div class="card">
      <h2>Products</h2>
      <div id="productsList">Loading...</div>
    </div>

    <div class="card">
      <h2>Orders</h2>
      <div id="ordersList">Loading...</div>
    </div>

  </div>

<script>

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


async function login() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const message = document.getElementById("loginMessage");

  if (!email || !password) {
    message.textContent = "Please enter email and password.";
    return;
  }

  const { data, error } = await supabaseClient.auth.signInWithPassword({
    email: email,
    password: password
  });

  if (error) {
    message.textContent = error.message;
    return;
  }

  const { data: admin, error: adminError } = await supabaseClient
    .from("admins")
    .select("id, role")
    .eq("id", data.user.id)
    .maybeSingle();

  if (adminError || !admin) {
    await supabaseClient.auth.signOut();
    message.textContent = "You are not authorized as an admin.";
    return;
  }

  document.getElementById("loginBox").classList.add("hidden");
  document.getElementById("adminPanel").classList.remove("hidden");

  document.getElementById("welcome").textContent =
    "Logged in as " + data.user.email;

  loadProducts();
  loadOrders();
}

      email,
      password
    });

  if (error) {

      error.message;
    return;
  }

  const { data: admin, error: adminError } =

      .select("id, role")
      .eq("id", data.user.id)

  if (adminError || !admin) {

    await supabaseClient.auth.signOut();

    return;
  }

  document.getElementById("loginBox").classList.add("hidden");
  document.getElementById("adminPanel").classList.remove("hidden");

  document.getElementById("welcome").textContent =
    "Logged in as " + data.user.email;

  loadProducts();
  loadOrders();
}


async function logout() {

  await supabaseClient.auth.signOut();

  document.getElementById("adminPanel").classList.add("hidden");
  document.getElementById("loginBox").classList.remove("hidden");
}


async function addProduct() {

  const name = document.getElementById("productName").value;
  const description =
    document.getElementById("productDescription").value;
  const price =
    document.getElementById("productPrice").value;
  const image_url =
    document.getElementById("productImage").value;
  const sizes =
    document.getElementById("productSizes").value;
  const stock =
    document.getElementById("productStock").value;

  const { error } = await supabaseClient
    .from("Products")
    .insert([{
      name,
      description,
      price,
      image_url,
      sizes,
      stock,
      is_active: true
    }]);

  if (error) {

    document.getElementById("productMessage").textContent =
      error.message;

    return;
  }

  document.getElementById("productMessage").textContent =
    "Product added successfully.";

  document.getElementById("productName").value = "";
  document.getElementById("productDescription").value = "";
  document.getElementById("productPrice").value = "";
  document.getElementById("productImage").value = "";
  document.getElementById("productSizes").value = "";
  document.getElementById("productStock").value = "";

  loadProducts();
}


async function loadProducts() {

  const { data, error } =
    await supabaseClient
      .from("Products")
      .select("*")
      .order("id", { ascending: false });

  const container = document.getElementById("productsList");

  if (error) {

    container.textContent = error.message;
    return;
  }

  if (!data || data.length === 0) {

    container.textContent = "No products yet.";
    return;
  }

  container.innerHTML = "";

  data.forEach(product => {

    const div = document.createElement("div");

    div.className = "product";

    div.innerHTML = `
      <strong>${escapeHtml(product.name)}</strong>
      <p>₹${product.price}</p>
      <p>Stock: ${product.stock ?? 0}</p>
    `;

    container.appendChild(div);
  });
}


async function loadOrders() {

  const { data, error } =
    await supabaseClient
      .from("Orders table")
      .select("*")
      .order("id", { ascending: false });

  const container = document.getElementById("ordersList");

  if (error) {

    container.textContent = error.message;
    return;
  }

  if (!data || data.length === 0) {

    container.textContent = "No orders yet.";
    return;
  }

  container.innerHTML = "";

  data.forEach(order => {

    const div = document.createElement("div");

    div.className = "product";

    div.innerHTML = `
      <strong>Order #${order.id}</strong>
      <p>Customer: ${escapeHtml(order.customer_name || "")}</p>
      <p>Total: ₹${order.total_amount || 0}</p>
      <p>Payment: ${escapeHtml(order.payment_status || "")}</p>
      <p>Status: ${escapeHtml(order.order_status || "")}</p>
    `;

    container.appendChild(div);
  });
}


function escapeHtml(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

</script>

</body>
  </html>
