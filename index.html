<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>T-Heart | Premium Clothing</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0a0a0a;
            color: white;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            border-bottom: 1px solid #222;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .hero {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 30px;
        }

        .hero h1 {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .hero p {
            color: #aaa;
            margin-bottom: 30px;
            font-size: 16px;
        }

        .btn {
            display: inline-block;
            background: white;
            color: black;
            padding: 14px 28px;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
        }

        .section {
            padding: 60px 20px;
            text-align: center;
        }

        .section h2 {
            font-size: 32px;
            margin-bottom: 30px;
        }

        .product {
            max-width: 350px;
            margin: auto;
            border: 1px solid #222;
            border-radius: 15px;
            padding: 20px;
        }

        .product h3 {
            margin: 15px 0 8px;
        }

        .price {
            color: #ccc;
            margin-bottom: 20px;
        }

        footer {
            border-top: 1px solid #222;
            padding: 30px;
            text-align: center;
            color: #777;
        }
    </style>
</head>

<body>

    <nav>
        <div class="logo">T-HEART</div>
        <div>☰</div>
    </nav>

    <section class="hero">
        <div>
            <h1>WEAR YOUR STORY.</h1>
            <p>Premium clothing. Made for your expression.</p>
            <a href="#shop" class="btn">SHOP NOW</a>
        </div>
    </section>

    <section class="section" id="shop">
        <h2>Featured</h2>

        <div class="product">
            <h3>T-Heart Signature Tee</h3>
            <p class="price">₹599</p>
            <a href="#" class="btn">VIEW PRODUCT</a>
        </div>
    </section>

    <section class="section">
        <h2>Custom T-Shirts</h2>
        <p>Have your own design? Create something personal.</p>
        <br>
        <a href="https://instagram.com/" class="btn">DM TO ORDER</a>
    </section>

    <footer>
        © 2026 T-Heart. All rights reserved.
    </footer>

</body>
  </html>
